<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Digital Mirror</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>

<body>

<div class="canvas-row">

  <!-- Human Mirror -->
  <div id="human-canvas-container"></div>

  <!-- Information -->
  <div id="information-container">

    <video
            id="information-video"
            preload="metadata"
            playsinline
            controls>
    </video>

  </div>

  <!-- Machine Mirror -->
  <div id="side-canvas-container"></div>

</div>

<!-- Shared application logic -->
<script src="js/common/claimApi.js"></script>
<script src="js/common/interactionFlow.js"></script>

<!-- Information -->
<script src="js/information/videoRegistry.js"></script>
<script src="js/information/informationVideo.js"></script>

<!-- Arduino -->
<script src="js/common/arduinoSimulator.js"></script>

<!-- Shared needle engine -->
<script src="js/common/needle/needleAgent.js"></script>
<script src="js/common/needle/needleSystem.js"></script>

<!-- Human Mirror -->
<script src="js/human/generativeUtils.js"></script>
<script src="js/human/humanCanvas.js"></script>

<!-- Machine Mirror -->
<script src="js/machine/machineSpeech.js"></script>
<script src="js/machine/machineMask.js"></script>
<script src="js/machine/machineFrame.js"></script>
<script src="js/machine/machineInterference.js"></script>

<script>
  window.addEventListener("DOMContentLoaded", () => {

    const container = document.getElementById(
            "side-canvas-container"
    );

    window.machineFrame = new MachineFrame(container);

    window.machineInterference =
            new MachineInterference(container);
  });
</script>

</body>
</html>
