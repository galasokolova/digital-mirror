<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Dual Canvas p5.js</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>

<body>
  <div class="canvas-row">
    <div id="video-canvas-container"></div>
    <div id="side-canvas-container"></div>
  </div>

  <!-- common modules -->
  <script src="js/common/api.js"></script>
  <script src="js/common/ui.js"></script>

  <!-- Left canvas (video effects) -->
  <script src="js/video/faceMath.js"></script>
  <script src="js/video/effects.js"></script>
  <script src="js/video/videoCanvas.js"></script>

  <!-- Right canvas (retro newspaper, CRT-effect) -->
  <script src="js/side/paperEffect.js"></script>
  <script src="js/side/crtEffect.js"></script>
  <script src="js/side/sideCanvas.js"></script>
</body>
</html>
